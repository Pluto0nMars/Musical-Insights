<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musical Insights Recommendation Engine</title>
    <link rel="stylesheet" href="prototype.css">
  </head>
  <body>
    <div class="app-container">
      <header>
        <i data-lucide="music-4"></i>
        <h1>Musical Insights AI</h1>
        <p class="subtitle"> UI prototype</p>
      </header>
      
      <section class="step-section">
          <h2> Step 1: Define your song Profile</h2>

          <div class="selector-grid">
            <div class="track-card">
              <i data-lucide="disc-3"></i>
              <h3>Track 1</h3>

              <select>
                <option>Choose a song...</option>
                <option>I'll Be Back! - By: Rilès</option>
                <option>Island In The Sun - By: Weezer</option>
              </select>

              <div class="slider-container">

                <label>
                  <i data-lucide="sliders-horizontal"></i>
                    Love Rating: <span class="weight-val">3</span>
                </label>
                <input type="range" min="1" max="5" value="3">
              </div>

            </div>

            <div class="track-card">
              <i data-lucide="disc-3"></i>
              <h3>Track 2</h3>

              <select>
                <option>Choose a song...</option>
                <option>I'll Be Back! - By: Rilès</option>
                <option>Island In The Sun - By: Weezer</option>
              </select>

              <div class="slider-container">

                <label>
                  <i data-lucide="sliders-horizontal"></i>
                    Love Rating: <span class="weight-val">3</span>
                </label>
                <input type="range" min="1" max="5" value="3">
              </div>

            </div>

            <div class="track-card">
              <i data-lucide="disc-3"></i>
              <h3>Track 3</h3>

              <select>
                <option>Choose a song...</option>
                <option>I'll Be Back! - By: Rilès</option>
                <option>Island In The Sun - By: Weezer</option>
              </select>

              <div class="slider-container">

                <label>
                  <i data-lucide="sliders-horizontal"></i>
                    Love Rating: <span class="weight-val">3</span>
                </label>
                <input type="range" min="1" max="5" value="3">
              </div>
            </div>
          </div>
          
        </section>

        <section class="step-section">
           <h2> Step 2: Generate Recommendations</h2>
           <button class="btn-submit" id="generate-btn">
            <i data-lucide="sparkles"></i>
              Generate Best Vibe Matches
           </button>
        </section>

        <section class="loading-container" id="loader">
            <i data-lucide="disc-3" class="spinning-icon"></i>
            <p>Generating track list...</p>
        </section>

        <section class="results-container" id="results">
            <h2>Your Curated Matches</h2>
            
            <div class="results-grid">
                <div class="rec-card">
                    <div class="track-info">
                        <strong class="track-name">Say It Ain't So</strong>
                        
                        <div class="meta-row">
                            <span class="artist-name">
                                <i data-lucide="user"></i> Weezer
                            </span>
                            <span class="album-name">
                                <i data-lucide="library"></i> Blue Album
                            </span>
                            <span class="duration-text">
                                <i data-lucide="clock"></i> 4:18
                            </span>
                        </div>
                    </div>
                    
                    <div class="genre-wrapper">
                        <i data-lucide="tag"></i>
                        <span class="genre-tag">Alternative</span>
                    </div>
                </div>

                <div class="rec-card">
                    <div class="track-info">
                        <strong class="track-name">In the Garage</strong>
                        
                        <div class="meta-row">
                            <span class="artist-name">
                                <i data-lucide="user"></i> Weezer
                            </span>
                            <span class="album-name">
                                <i data-lucide="library"></i> Blue Album
                            </span>
                            <span class="duration-text">
                                <i data-lucide="clock"></i> 3:55
                            </span>
                        </div>
                    </div>
                    
                    <div class="genre-wrapper">
                        <i data-lucide="tag"></i>
                        <span class="genre-tag">Rock</span>
                    </div>
                </div>
            </div>
        </section>
      
    </div>


    

    <script src="https://unpkg.com/lucide@latest"></script>
     <script>
        lucide.createIcons();

        const generateBtn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');
        const results = document.getElementById('results');


        generateBtn.addEventListener('click',async ()=>{
          loader.style.display = 'flex';

          results.style.display = 'none';

          try {
            const response = await fetch('http://127.0.0.1:5000/api/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        
                        tracks: ["Island In The Sun", "Say It Ain't So"],
                        weights: [5, 4]
                    })
                });

                const data = await response.json();
                console.log("Data returned from Flask server:", data);

                
                loader.style.display = 'none';
                results.style.display = 'block';

          }catch(error){
            console.error("Could not connect to Flask:", error);
            loader.style.display = 'none';
            alert("Error connecting to Python backend! Is app.py running?");
          }

        });
    </script>
  </body>
</html>
