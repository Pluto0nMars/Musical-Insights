<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musical Insights Recommendation Engine</title>
    <link rel="stylesheet" href="prototype.css">
  </head>
  <body>
    <div class="app-container">
      <header>
        <i data-lucide="music-4"></i>
        <h1>Musical Insights</h1>
        <p class="subtitle">Interactive Music Recommender</p>
      </header>
      
      <section class="step-section">
        <h2>Step 1: Define your song Profile</h2>


        <datalist id="song-suggestions"></datalist>

        <div class="selector-grid">
          <div class="track-card">
            <i data-lucide="disc-3"></i>
            <h3>Track 1</h3>
            <input 
              type="text" 
              class="track-input track-select" 
              list="song-suggestions" 
              placeholder="Search a song..." 
              placeholder="Optional track..."
            />
            <div class="slider-container">
              <label>
                <i data-lucide="sliders-horizontal"></i>
                Love Rating: <span class="weight-val">3</span>
              </label>
              <input type="range" class="track-weight" min="1" max="5" value="3">
            </div>
          </div>

          <div class="track-card">
            <i data-lucide="disc-3"></i>
            <h3>Track 2</h3>
            <input 
              type="text" 
              class="track-input track-select" 
              list="song-suggestions" 
              placeholder="Search a song..." 
              placeholder="Optional track..."
            />
            <div class="slider-container">
              <label>
                <i data-lucide="sliders-horizontal"></i>
                Love Rating: <span class="weight-val">3</span>
              </label>
              <input type="range" class="track-weight" min="1" max="5" value="3">
            </div>
          </div>

          <div class="track-card">
            <i data-lucide="disc-3"></i>
            <h3>Track 3</h3>
            <input 
              type="text" 
              class="track-input track-select" 
              list="song-suggestions" 
              placeholder="Search a song..." 
              placeholder="Optional track..."
            />
            <div class="slider-container">
              <label>
                <i data-lucide="sliders-horizontal"></i>
                Love Rating: <span class="weight-val">3</span>
              </label>
              <input type="range" class="track-weight" min="1" max="5" value="3">
            </div>
          </div>
        </div>
      </section>

      <section class="step-section">
        <h2>Step 2: Generate Recommendations</h2>
        <button class="btn-submit" id="generate-btn">
          <i data-lucide="sparkles"></i>
          Generate Best Vibe Matches
        </button>
      </section>

      <section class="loading-container" id="loader" style="display: none;">
        <i data-lucide="disc-3" class="spinning-icon"></i>
        <p>Calculating vector similarity across 81,000+ tracks...</p>
      </section>

      <section class="results-container" id="results" style="display: none;">
        <h2>Your Curated Matches</h2>
        <div class="results-grid" id="results-grid"></div>
      </section>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();

      const generateBtn = document.getElementById('generate-btn');
      const loader = document.getElementById('loader');
      const results = document.getElementById('results');
      const resultsGrid = document.getElementById('results-grid');
      const datalist = document.getElementById('song-suggestions');

    
      document.querySelectorAll('.track-input').forEach(input => {
        let debounceTimer;
        input.addEventListener('input', (e) => {
          clearTimeout(debounceTimer);
          const query = e.target.value.trim();
          
          if (query.length < 2) return;

          debounceTimer = setTimeout(async () => {
            try {
              const res = await fetch(`http://127.0.0.1:5000/api/search?q=${encodeURIComponent(query)}`);
              const suggestions = await res.json();
              
              console.log("Suggestions returned from Flask:", suggestions); // Debug log
              
              datalist.innerHTML = ''; // Clear previous options
              
              suggestions.forEach(item => {
                const option = document.createElement('option');
                option.value = item.title; // What gets typed into input
                option.label = `${item.title} — ${item.artist}`;
                datalist.appendChild(option);
              });
            } catch (err) {
              console.error("Search fetch failed:", err);
            }
          }, 250);
        });
      });

      //  slider number updates
      document.querySelectorAll('.track-card').forEach(card => {
        const slider = card.querySelector('.track-weight');
        const valSpan = card.querySelector('.weight-val');
        if (slider && valSpan) {
          slider.addEventListener('input', (e) => {
            valSpan.textContent = e.target.value;
          });
        }
      });
      

      //  Render Recommendation Cards
      function renderRecommendations(songs) {
        resultsGrid.innerHTML = '';

        songs.forEach((song, index) => {
          const cardHTML = `
            <div class="rec-card">
              <div class="track-info">
                <strong class="track-name">${song.title}</strong>
                <div class="meta-row">
                  <span class="artist-name">
                    <i data-lucide="user"></i> ${song.artist}
                  </span>
                  <span class="album-name">
                    <i data-lucide="library"></i> ${song.album}
                  </span>
                  <span class="duration-text">
                    <i data-lucide="clock"></i> ${song.duration}
                  </span>
                </div>
              </div>
              <div class="genre-wrapper">
                <i data-lucide="tag"></i>
                <span class="genre-tag">${song.genre}</span>
              </div>
            </div>
          `;
          resultsGrid.innerHTML += cardHTML;
        });

        if (window.lucide) {
          lucide.createIcons();
        }
      }

      generateBtn.addEventListener('click', async () => {
        const selectedTracks = [];
        const selectedWeights = [];

        document.querySelectorAll('.track-card').forEach(card => {
          const trackVal = card.querySelector('.track-input').value.trim();
          const weightVal = parseFloat(card.querySelector('.track-weight').value);
          
          if (trackVal) {
            selectedTracks.push(trackVal);
            selectedWeights.push(weightVal);
          }
        });

        if (selectedTracks.length === 0) {
          alert("Please enter or search for at least one track!");
          return;
        }

        loader.style.display = 'flex';
        results.style.display = 'none';

        try {
          const response = await fetch('http://127.0.0.1:5000/api/recommend', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tracks: selectedTracks,
              weights: selectedWeights
            })
          });

          const data = await response.json();

          if (data.success && data.results && data.results.length > 0) {
            renderRecommendations(data.results);
            loader.style.display = 'none';
            results.style.display = 'block';
          } else {
            alert(data.message || "Track not found in database. Try picking a track from the search suggestions!");
            loader.style.display = 'none';
          }
        } catch (error) {
          console.error("Could not connect to Flask:", error);
          loader.style.display = 'none';
          alert("Error connecting to Python backend! Is app.py running?");
        }
      });
    </script>
  </body>
</html>
